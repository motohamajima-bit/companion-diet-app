          return { ...prev, voice_enabled: nextVal };
        });
      };

      const weekDates = useMemo(() => {
        const centerDate = addDays(todayStr, weekOffset * 7);
        const list = [];
        for (let i = -3; i <= 3; i++) {
          list.push(addDays(centerDate, i));
        }
        return list;
      }, [todayStr, weekOffset]);

      const streakDays = useMemo(() => {
        const recordedSet = new Set((appData.meal_history || []).map((m) => m.date));
        let count = 0;
        let checkDate = todayStr;
        if (!recordedSet.has(checkDate)) {
          checkDate = addDays(todayStr, -1);
        }
        while (recordedSet.has(checkDate)) {
          count++;
          checkDate = addDays(checkDate, -1);
        }
        return count;
      }, [appData.meal_history, todayStr]);

      const selectedDayMeals = useMemo(() => {
        return (appData.meal_history || []).filter((m) => m.date === selectedDate);
      }, [appData.meal_history, selectedDate]);

      const dayNutrition = useMemo(() => {
        let calories = 0;
        let protein = 0;
        let fat = 0;
        let carbs = 0;
        let salt = 0;
        let fiber = 0;

        selectedDayMeals.forEach((m) => {
          calories += Number(m.calories) || 0;
          protein += Number(m.protein) || 0;
          fat += Number(m.fat) || 0;
          carbs += Number(m.carbs) || 0;
          salt += Number(m.salt) || 0;
          fiber += Number(m.fiber) || 0;
        });

        return {
          calories: Math.round(calories),
          protein: Math.round(protein * 10) / 10,
          fat: Math.round(fat * 10) / 10,
          carbs: Math.round(carbs * 10) / 10,
          salt: Math.round(salt * 10) / 10,
          fiber: Math.round(fiber * 10) / 10
        };
      }, [selectedDayMeals]);

      const targetCalories = appData.user_profile?.target_calories || 2000;
      const targetPFC = useMemo(() => {
        return calculateTargetPFC(targetCalories, appData.user_profile?.gender || "male");
      }, [targetCalories, appData.user_profile?.gender]);

      const hasBreakfast = selectedDayMeals.some((m) => m.meal_type === "breakfast");
      const hasLunch = selectedDayMeals.some((m) => m.meal_type === "lunch");
      const hasDinner = selectedDayMeals.some((m) => m.meal_type === "dinner");

      const runDailyAIAdvice = async (mealsForDay, isThreeMealsJustCompleted = false) => {
        unlockSpeechSynthesis();
        setIsAnalyzingDaily(true);
        const buddy = currentBuddy;
        const lv = currentExpInfo.level;

        let totalCal = 0;
        let actualP = 0;
        let actualF = 0;
        let actualC = 0;
        let actualSalt = 0;
        let actualFiber = 0;
        const summaryItems = [];

        mealsForDay.forEach((m) => {
          totalCal += Number(m.calories) || 0;
          actualP += Number(m.protein) || 0;
          actualF += Number(m.fat) || 0;
          actualC += Number(m.carbs) || 0;
          actualSalt += Number(m.salt) || 0;
          actualFiber += Number(m.fiber) || 0;
          summaryItems.push(`${m.meal_type}: ${(m.menu_names || []).join("+")}(${m.calories}kcal)`);
        });

        actualP = Math.round(actualP * 10) / 10;
        actualF = Math.round(actualF * 10) / 10;
        actualC = Math.round(actualC * 10) / 10;
        actualSalt = Math.round(actualSalt * 10) / 10;
        actualFiber = Math.round(actualFiber * 10) / 10;

        if (appData.api_key && mealsForDay.length > 0) {
          try {
            const sysInst = `あなたはダイエットバディ「${buddy.name}」です。設定: ${buddy.systemPrompt}\n親愛度: Lv.${lv}`;
            const prompt = `対象日（${selectedDate}）の食事記録データを総合分析し、バディとしてアドバイスを行ってください。
- 目標カロリー: ${targetCalories} kcal に対し 実績: ${totalCal} kcal
- 目標PFC: P:${targetPFC.protein}g / F:${targetPFC.fat}g / C:${targetPFC.carbs}g
- 実績PFC: P:${actualP}g / F:${actualF}g / C:${actualC}g (塩分:${actualSalt}g / 食物繊維:${actualFiber}g)
- 記録された食事一覧: ${summaryItems.join(" / ")}
- 3食コンプリート達成直後フラグ: ${isThreeMealsJustCompleted} (trueの場合はまず3食きっちり記録したことを褒めてから栄養分析に入ること)

カロリーオーバーや栄養偏りがあればキャラ口調でしっかり怒り（または心配し）、バランスが良ければ全力で褒めてください。具体的なおすすめ食材や控えるべきものも150〜200字程度でアドバイスしてください。

以下のJSONスキーマのみで出力してください:
{
  "emotion": "smile",
  "advice_text": "バディ口調での1日の総合アドバイス（150〜200字）",
  "score": 85
}`;
            const res = await callGeminiAPI(appData.api_key, sysInst, prompt);
            const emotion = res.emotion || "smile";
            const text = res.advice_text || buddy.threeMealsPraise;
            updateBuddySpeech(text, emotion, true);
            setIsAnalyzingDaily(false);
            return;
          } catch (err) {
            console.warn("Daily AI advice fallback:", err);
          }
        }

        const localRes = generateLocalDailyAdvice(
          buddy,
          totalCal,
          targetCalories,
          { protein: actualP, fat: actualF, carbs: actualC, salt: actualSalt, fiber: actualFiber },
          targetPFC,
          isThreeMealsJustCompleted
        );
        updateBuddySpeech(localRes.advice_text, localRes.emotion, true);
        setIsAnalyzingDaily(false);
      };

      const handleSaveProfile = (formValues) => {
        unlockSpeechSynthesis();
        const isFirstSetup = !appData.user_profile;
        const userId = appData.user_profile?.user_id || generateUUID();

        const newProfile = {
          user_id: userId,
          nickname: formValues.nickname,
          gender: formValues.gender,
          age: formValues.age,
          height: formValues.height,
          current_weight: formValues.currentWeight,
          target_weight: formValues.targetWeight,
          activity_level: formValues.activityLevel,
          bmr: formValues.bmr,
          target_calories: formValues.targetCalories,
          selected_buddy: formValues.selectedBuddy,
          last_login_date: todayStr
        };

        setAppData((prev) => ({
          ...prev,
          api_key: formValues.apiKey,
          user_profile: newProfile
        }));

        setIsProfileModalOpen(false);

        const newBuddy = BUDDY_DEFINITIONS[formValues.selectedBuddy] || BUDDY_DEFINITIONS.riko;
        const greet = isFirstSetup
          ? `${formValues.nickname}さん、はじめまして！${newBuddy.name}です！目標${formValues.targetWeight}kg、1日${formValues.targetCalories}kcal目標に向けて、今日から一緒に頑張りましょうね！`
          : `プロフィール設定を更新しましたよ！引き続き目標に向けて一緒に頑張りましょう！`;
        setBuddyEmotion("smile");
        setBuddyDialogue(greet);
        speakBuddyDialogue(greet, newBuddy.id, appData.voice_enabled, formValues.apiKey, setIsGeneratingSpeech);
      };

      const handleSaveMealRecord = (newMeal) => {
        const updatedMeals = [...(appData.meal_history || []), newMeal];
        const dayMealsAfter = updatedMeals.filter((m) => m.date === newMeal.date);

        const bDone = dayMealsAfter.some((m) => m.meal_type === "breakfast");
        const lDone = dayMealsAfter.some((m) => m.meal_type === "lunch");
        const dDone = dayMealsAfter.some((m) => m.meal_type === "dinner");
        const alreadyBonusAwarded = (appData.daily_three_meals_bonus_dates || []).includes(newMeal.date);
        const isThreeMealsJustCompleted = bDone && lDone && dDone && !alreadyBonusAwarded;

        const expGain = isThreeMealsJustCompleted ? 30 : 10;

        setAppData((prev) => {
          const bId = prev.user_profile?.selected_buddy || "riko";
          const currExp = prev.buddy_progress?.[bId]?.exp || 0;
          const nextExp = currExp + expGain;
          const nextLv = calculateLevelFromExp(nextExp);

          return {
            ...prev,
            meal_history: updatedMeals,
            daily_three_meals_bonus_dates: isThreeMealsJustCompleted
              ? [...(prev.daily_three_meals_bonus_dates || []), newMeal.date]
              : prev.daily_three_meals_bonus_dates || [],
            buddy_progress: {
              ...prev.buddy_progress,
              [bId]: { exp: nextExp, level: nextLv }
            }
          };
        });

        setMealModalConfig({ isOpen: false, mealType: "lunch", mode: "manual" });

        if (isThreeMealsJustCompleted) {
          showToast("🎊 朝・昼・夕 3食記録コンプリートボーナス！ (+30 EXP)");
          runDailyAIAdvice(dayMealsAfter, true);
        } else {
          showToast("🍽️ 食事を記録しました！ (+10 EXP)");
          updateBuddySpeech(newMeal.buddy_comment, newMeal.buddy_emotion || "smile", true);
        }
      };

      const handleDeleteMeal = (mealId) => {
        setAppData((prev) => ({
          ...prev,
          meal_history: (prev.meal_history || []).filter((m) => m.meal_id !== mealId)
        }));
        showToast("🗑️ 食事記録を削除しました");
      };

      const handleSaveWeight = (e) => {
        e.preventDefault();
        unlockSpeechSynthesis();
        const wVal = Number(weightInput);
        if (!wVal || wVal < 25 || wVal > 250) {
          showToast("⚠️ 正しい体重(kg)を入力してください");
          return;
        }

        const roundedW = Math.round(wVal * 10) / 10;
        setAppData((prev) => {
          const filtered = (prev.weight_history || []).filter((item) => item.date !== selectedDate);
          const nextHistory = [...filtered, { date: selectedDate, weight: roundedW }].sort((a, b) =>
            a.date.localeCompare(b.date)
          );
          return {
            ...prev,
            user_profile: prev.user_profile
              ? { ...prev.user_profile, current_weight: roundedW }
              : prev.user_profile,
            weight_history: nextHistory
          };
        });

        const diffTarget = Math.max(0, roundedW - (appData.user_profile?.target_weight || roundedW)).toFixed(1);
        const msg = `${selectedDate}の体重、${roundedW}kgを記録しました！目標の${appData.user_profile?.target_weight}kgまで、あと${diffTarget}kgですね！`;
        showToast(`⚖️ 体重 ${roundedW}kg を保存しました！`);
        updateBuddySpeech(msg, "smile", true);
      };

      const handleSwitchBuddy = (newBuddyId) => {
        if (!BUDDY_DEFINITIONS[newBuddyId]) return;
        unlockSpeechSynthesis();
        setAppData((prev) => ({
          ...prev,
          user_profile: {
            ...prev.user_profile,
            selected_buddy: newBuddyId
          }
        }));
        const nextB = BUDDY_DEFINITIONS[newBuddyId];
        const lv = calculateLevelFromExp(appData.buddy_progress?.[newBuddyId]?.exp || 0);
        const quote = nextB.quotes[lv]?.[0] || nextB.quotes[1][0];
        setBuddyEmotion("smile");
        setBuddyDialogue(quote);
        speakBuddyDialogue(quote, newBuddyId, appData.voice_enabled, appData.api_key, setIsGeneratingSpeech);
        showToast(`🤝 パートナーを「${nextB.name}」に交代しました！`);
      };

      const calorieDiff = targetCalories - dayNutrition.calories;
      const caloriePercent = targetCalories > 0
        ? Math.min(100, Math.max(0, Math.round((dayNutrition.calories / targetCalories) * 100)))
        : 0;

      return (
        <div className="min-h-screen flex flex-col bg-gray-50 text-gray-800">
          {toastNotice && (
            <div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-gray-900/90 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg animate-pop">
              {toastNotice}
            </div>
          )}

          {/* 画面1: 最上部ヘッダー & 週間日付リングカレンダー */}
          <header className="bg-white shadow-xs sticky top-0 z-30">
            <div className="px-3.5 py-2.5 flex items-center justify-between border-b border-gray-100">
              <div className="flex items-center gap-2">
                <span className="text-base font-extrabold text-gray-800">
                  {selectedDate.slice(0, 4)}年{Number(selectedDate.slice(5, 7))}月
                </span>
                <span className="text-[11px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">
                  🔥 {streakDays}日連続
                </span>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  type="button"
                  onClick={toggleVoiceEnabled}
                  className={`px-2.5 py-1 rounded-full text-xs font-bold border transition flex items-center gap-1 ${
                    appData.voice_enabled
                      ? "bg-emerald-50 text-emerald-700 border-emerald-300"
                      : "bg-gray-100 text-gray-500 border-gray-200"
                  }`}
                >
                  <span>{appData.voice_enabled ? "🔊 AI音声ON" : "🔇 音声OFF"}</span>
                </button>

                <button
                  type="button"
                  onClick={() => setIsProfileModalOpen(true)}
                  className="p-1.5 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm"
                  title="設定"
                >
                  ⚙️
                </button>
              </div>
            </div>

            <div className="px-2 py-2 flex items-center justify-between bg-white">
              <button
                type="button"
                onClick={() => setWeekOffset((prev) => prev - 1)}
                className="w-7 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-500 font-bold"
                title="前の週"
              >
                ＜
              </button>

              <div className="flex-1 grid grid-cols-7 gap-1">
                {weekDates.map((dStr) => {
                  const isSelected = dStr === selectedDate;
                  const isToday = dStr === todayStr;
                  const mealsOnDate = (appData.meal_history || []).filter((m) => m.date === dStr);
                  const hasAnyRecord = mealsOnDate.length > 0;
                  const has3Meals =
                    mealsOnDate.some((m) => m.meal_type === "breakfast") &&
                    mealsOnDate.some((m) => m.meal_type === "lunch") &&
                    mealsOnDate.some((m) => m.meal_type === "dinner");
                  const dayNum = Number(dStr.slice(8, 10));
                  const dow = getDayOfWeekLabel(dStr);

                  return (
                    <button
                      type="button"
                      key={dStr}
                      onClick={() => setSelectedDate(dStr)}
                      className={`flex flex-col items-center py-1 rounded-xl transition ${
                        isSelected ? "bg-emerald-50" : "hover:bg-gray-50"
                      }`}
                    >
                      <span
                        className={`text-[10px] font-bold ${
                          isToday ? "text-emerald-600" : "text-gray-500"
                        }`}
                      >
                        {isToday ? "今日" : dow}
                      </span>
                      <div
                        className={`w-8 h-8 mt-0.5 rounded-full flex items-center justify-center text-xs font-extrabold relative border-2 transition ${
                          has3Meals
                            ? "bg-emerald-500 text-white border-emerald-600"
                            : hasAnyRecord
                            ? "bg-white text-emerald-700 border-emerald-500"
                            : isSelected
                            ? "bg-white text-gray-800 border-gray-800"
                            : "bg-gray-50 text-gray-600 border-gray-200"
                        }`}
                      >
                        {dayNum}
                        {has3Meals && (
                          <span className="absolute -bottom-1 -right-1 text-[9px] bg-white text-emerald-600 rounded-full px-0.5 shadow">
                            ✓
                          </span>
                        )}
                      </div>
                    </button>
                  );
                })}
              </div>

              <button
                type="button"
                onClick={() => setWeekOffset((prev) => prev + 1)}
                className="w-7 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-500 font-bold"
                title="次の週"
              >
                ＞
              </button>
            </div>
          </header>

          {/* メインコンテンツ */}
          <main className="px-3.5 pt-3 space-y-3.5 flex-1">
            {/* 画面2: AIコンパニオン吹き出し & コースバー & 栄養タブパネル */}
            <section className="flex items-start gap-3">
              {React.createElement(BuddyAvatar, {
                buddy: currentBuddy,
                emotion: buddyEmotion,
                expPercent: currentExpInfo.percent,
                level: currentExpInfo.level,
                onClick: handleTapBuddyAvatar
              })}

              <div className="flex-1 speech-bubble p-3 shadow-xs min-h-[108px] flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[11px] font-extrabold" style={{ color: currentBuddy.themeColor }}>
                      {currentBuddy.name}（{currentBuddy.role}）
                    </span>
                    <span
                      className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${
                        (EMOTION_META[buddyEmotion] || EMOTION_META.neutral).badgeBg
                      }`}
                    >
                      {(EMOTION_META[buddyEmotion] || EMOTION_META.neutral).face}{" "}
                      {(EMOTION_META[buddyEmotion] || EMOTION_META.neutral).label}
                    </span>
                  </div>
                  <p className="text-xs text-gray-700 leading-relaxed font-medium">
                    {buddyDialogue || "今日も一日、食事と健康の記録を一緒に頑張りましょう！"}
                  </p>
                </div>

                <div className="flex items-center justify-between pt-2 mt-1 border-t border-gray-100">
                  <span className="text-[10px] text-gray-400">
                    {isGeneratingSpeech ? (
                      <span className="text-indigo-600 font-bold animate-pulse">🎙️ AI音声生成中...</span>
                    ) : (
                      <span>EXP {currentExpInfo.current} / {currentExpInfo.next}</span>
                    )}
                  </span>
                  <button
                    type="button"
                    disabled={isGeneratingSpeech}
                    onClick={() => {
                      unlockSpeechSynthesis();
                      speakBuddyDialogue(buddyDialogue, currentBuddy.id, true, appData.api_key, setIsGeneratingSpeech);
                    }}
                    className="text-[11px] font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 disabled:opacity-50 px-2 py-0.5 rounded-md flex items-center gap-1 transition"
                  >
                    <span>🔈 {isGeneratingSpeech ? "生成中" : "AI再生"}</span>
                  </button>
                </div>
              </div>
            </section>

            <div className="bg-white rounded-xl px-3 py-2 border border-gray-200 flex items-center justify-between text-xs shadow-2xs">
              <div className="flex items-center gap-1.5 font-bold text-gray-700">
                <span>{currentBuddy.emoji}</span>
                <span>{currentBuddy.name}とダイエット伴走コース</span>
                <span className="text-[10px] text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded font-mono">
                  🎙️ {currentBuddy.geminiVoice}
                </span>
              </div>
              <button
                type="button"
                onClick={() => setIsWeeklyModalOpen(true)}
                className="text-emerald-600 hover:text-emerald-700 font-bold text-[11px] flex items-center gap-0.5"
              >
                <span>⚙️ 交代・レポート</span>
              </button>
            </div>

            <section className="bg-white rounded-2xl shadow-xs border border-gray-200 overflow-hidden">
              <div className="grid grid-cols-2 border-b border-gray-200 bg-gray-50 text-xs font-bold">
                <button
                  type="button"
                  onClick={() => setNutritionTab("calories")}
                  className={`py-2.5 text-center transition border-b-2 ${
                    nutritionTab === "calories"
                      ? "bg-white text-emerald-600 border-emerald-600"
                      : "text-gray-500 border-transparent hover:text-gray-700"
                  }`}
                >
                  🔥 摂取カロリー
                </button>
                <button
                  type="button"
                  onClick={() => setNutritionTab("pfc")}
                  className={`py-2.5 text-center transition border-b-2 ${
                    nutritionTab === "pfc"
                      ? "bg-white text-emerald-600 border-emerald-600"
                      : "text-gray-500 border-transparent hover:text-gray-700"
                  }`}
                >
                  🥗 PFCバランス
                </button>
              </div>

              <div className="p-3.5">
                {nutritionTab === "calories" ? (
                  <div className="space-y-2.5">
                    <div className="flex items-baseline justify-between">
                      <div>
                        <span className="text-xs text-gray-500 font-bold mr-1">摂取</span>
                        <span className="text-2xl font-extrabold text-gray-900">{dayNutrition.calories}</span>
                        <span className="text-xs text-gray-500 ml-1">/ 目標 {targetCalories} kcal</span>
                      </div>
                      <div className="text-right">
                        {calorieDiff >= 0 ? (
                          <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg">
                            あと {calorieDiff} kcal
                          </span>
                        ) : (
                          <span className="text-xs font-bold text-red-600 bg-red-50 px-2 py-1 rounded-lg">
                            超過 {Math.abs(calorieDiff)} kcal
                          </span>
                        )}
                      </div>
                    </div>

                    <div className="w-full h-3.5 bg-gray-100 rounded-full overflow-hidden border border-gray-200">
                      <div
                        className={`h-full transition-all duration-300 ${
                          calorieDiff < 0 ? "bg-red-500" : "bg-emerald-500"
                        }`}
                        style={{ width: `${caloriePercent}%` }}
                      />
                    </div>

                    <div className="flex justify-between text-[11px] text-gray-500 pt-0.5">
                      <span>基礎代謝(BMR): {appData.user_profile?.bmr || 1500} kcal</span>
                      <span>選択日: {selectedDate}</span>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-2.5 text-xs">
                    {[
                      { label: "タンパク質 (P)", actual: dayNutrition.protein, target: targetPFC.protein, unit: "g", color: "bg-rose-500" },
                      { label: "脂質 (F)", actual: dayNutrition.fat, target: targetPFC.fat, unit: "g", color: "bg-amber-500" },
                      { label: "炭水化物 (C)", actual: dayNutrition.carbs, target: targetPFC.carbs, unit: "g", color: "bg-blue-500" },
                      { label: "食物繊維", actual: dayNutrition.fiber, target: targetPFC.fiber, unit: "g", color: "bg-emerald-500" },
                      { label: "食塩相当量", actual: dayNutrition.salt, target: targetPFC.salt, unit: "g未満", color: "bg-indigo-500" }
                    ].map((item, idx) => {
                      const pct = item.target > 0 ? Math.min(100, Math.round((item.actual / item.target) * 100)) : 0;
                      const isOverSalt = item.label === "食塩相当量" && item.actual > item.target;
                      return (
                        <div key={idx}>
                          <div className="flex justify-between text-[11px] mb-0.5">
                            <span className="font-bold text-gray-700">{item.label}</span>
                            <span className={isOverSalt ? "text-red-600 font-bold" : "text-gray-600"}>
                              {item.actual} / {item.target} {item.unit}
                            </span>
                          </div>
                          <div className="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div
                              className={`h-full ${isOverSalt ? "bg-red-500" : item.color}`}
                              style={{ width: `${pct}%` }}
                            />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                <button
                  type="button"
                  disabled={isAnalyzingDaily}
                  onClick={() => runDailyAIAdvice(selectedDayMeals, false)}
                  className="mt-3.5 w-full py-2.5 px-4 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow-sm flex items-center justify-center gap-2 transition"
                >
                  <span className="flex items-center gap-1 text-sm">
                    <span className={hasBreakfast ? "opacity-100" : "opacity-40"}>🌅</span>
                    <span className={hasLunch ? "opacity-100" : "opacity-40"}>☀️</span>
                    <span className={hasDinner ? "opacity-100" : "opacity-40"}>🌙</span>
                  </span>
                  <span>
                    {isAnalyzingDaily
                      ? `${currentBuddy.name}が1日の栄養バランスを分析中...`
                      : "アドバイス（1日の総合AI分析＆AI音声読み上げ）"}
                  </span>
                </button>
              </div>
            </section>

            {/* 画面3: カラダ記録（体重クイック入力） & 朝昼夕間食 4区分カード */}
            <section className="bg-white rounded-2xl p-3.5 shadow-xs border border-gray-200">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-1.5">
                  <span className="text-base">⚖️</span>
                  <h3 className="text-xs font-extrabold text-gray-800">カラダ記録（{selectedDate} の体重）</h3>
                </div>
                <button
                  type="button"
                  onClick={() => setIsWeeklyModalOpen(true)}
                  className="text-[11px] bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-2.5 py-1 rounded-lg transition"
                >
                  📈 週間レポート・体重グラフ
                </button>
              </div>

              <form onSubmit={handleSaveWeight} className="flex items-center gap-2">
                <div className="relative flex-1">
                  <input
                    type="number"
                    step="0.1"
                    value={weightInput}
                    onChange={(e) => setWeightInput(e.target.value)}
                    placeholder="体重を入力"
                    className="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                  <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 font-bold">
                    kg
                  </span>
                </div>
                <button
                  type="submit"
                  className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-xs shrink-0 transition"
                >
                  体重を記録
                </button>
              </form>

              {appData.user_profile && (
                <div className="mt-2 flex justify-between text-[11px] text-gray-500">
                  <span>現在: <strong>{appData.user_profile.current_weight} kg</strong></span>
                  <span>目標: <strong>{appData.user_profile.target_weight} kg</strong></span>
                  <span className="text-emerald-700 font-bold">
                    目標まであと {Math.max(0, (Number(appData.user_profile.current_weight) - Number(appData.user_profile.target_weight))).toFixed(1)} kg
                  </span>
                </div>
              )}
            </section>

            <section className="space-y-2.5">
              {MEAL_TYPES.map((mt) => {
                const items = selectedDayMeals.filter((m) => m.meal_type === mt.key);
                const sectionCal = items.reduce((sum, m) => sum + (Number(m.calories) || 0), 0);
                const isRecorded = items.length > 0;

                return (
                  <div
                    key={mt.key}
                    className="bg-white rounded-2xl p-3.5 shadow-xs border border-gray-200"
                  >
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <div className={`w-9 h-9 rounded-xl ${mt.bg} flex items-center justify-center text-lg relative`}>
                          <span>{mt.icon}</span>
                          {isRecorded && (
                            <span className="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 text-white rounded-full text-[10px] flex items-center justify-center font-bold shadow">
                              ✓
                            </span>
                          )}
                        </div>
                        <div>
                          <h4 className="text-sm font-extrabold text-gray-800">{mt.label}</h4>
                          <span className="text-[11px] text-gray-500 font-medium">
                            {isRecorded ? `合計 ${sectionCal} kcal` : "未記録"}
                          </span>
                        </div>
                      </div>

                      <div className="flex items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() => setMealModalConfig({ isOpen: true, mealType: mt.key, mode: "photo" })}
                          className="px-2.5 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-[11px] flex items-center gap-1 transition"
                        >
                          <span>📷 写真</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => setMealModalConfig({ isOpen: true, mealType: mt.key, mode: "manual" })}
                          className="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-[11px] flex items-center gap-1 transition"
                        >
                          <span>✏️ 手動</span>
                        </button>
                      </div>
                    </div>

                    {isRecorded && (
                      <div className="mt-2.5 pt-2 border-t border-gray-100 space-y-1.5">
                        {items.map((meal) => (
                          <div
                            key={meal.meal_id}
                            className="flex items-center justify-between text-xs bg-gray-50 px-2.5 py-1.5 rounded-lg"
                          >
                            <div className="pr-2">
                              <div className="font-bold text-gray-800">
                                {(meal.menu_names || []).join("・")}
                              </div>
                              <div className="text-[10px] text-gray-500">
                                P:{meal.protein}g / F:{meal.fat}g / C:{meal.carbs}g
                              </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <span className="font-extrabold text-gray-700">{meal.calories} kcal</span>
                              <button
                                type="button"
                                onClick={() => handleDeleteMeal(meal.meal_id)}
                                className="text-gray-400 hover:text-red-500 text-xs font-bold px-1"
                                title="削除"
                              >
                                ✕
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </section>
          </main>

          {/* 右下フローティング「＋」クイック記録ボタン */}
          <button
            type="button"
            onClick={() => setMealModalConfig({ isOpen: true, mealType: "lunch", mode: "manual" })}
            className="fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white shadow-xl flex items-center justify-center text-2xl font-extrabold active:scale-95 transition"
            title="食事を記録"
          >
            ＋
          </button>

          {/* モーダル群（React.createElement で安全に描画） */}
          {React.createElement(ProfileOnboardingModal, {
            isOpen: isProfileModalOpen || !appData.user_profile,
            initialData: appData,
            isForced: !appData.user_profile,
            onSave: handleSaveProfile,
            onClose: () => setIsProfileModalOpen(false)
          })}

          {React.createElement(MealRecordModal, {
            isOpen: mealModalConfig.isOpen,
            onClose: () => setMealModalConfig({ ...mealModalConfig, isOpen: false }),
            initialMealType: mealModalConfig.mealType,
            initialMode: mealModalConfig.mode,
            selectedDate: selectedDate,
            buddy: currentBuddy,
            buddyLevel: currentExpInfo.level,
            targetCalories: targetCalories,
            consumedCalories: dayNutrition.calories,
            apiKey: appData.api_key,
            onSaveMeal: handleSaveMealRecord
          })}

          {React.createElement(WeeklyReportModal, {
            isOpen: isWeeklyModalOpen,
            onClose: () => setIsWeeklyModalOpen(false),
            appData: appData,
            selectedDate: selectedDate,
            onSwitchBuddy: handleSwitchBuddy,
            onUpdateBuddySpeech: updateBuddySpeech
          })}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
