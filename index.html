      try {
        const ctx = getOrInitAudioContext();
        if (ctx) {
          const buffer = ctx.createBuffer(1, 1, 22050);
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          source.start(0);
        }
      } catch (e) {}
      if (typeof window !== "undefined" && "speechSynthesis" in window) {
        try {
          const silent = new SpeechSynthesisUtterance("");
          silent.volume = 0;
          window.speechSynthesis.speak(silent);
        } catch (e) {}
      }
    };

    // 【アイデア3】読み上げテキストを自然な日本語発音・息継ぎにクレンジングする関数
    const formatTextForNaturalSpeech = (rawText) => {
      if (!rawText) return "";
      return rawText
        .replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, "")
        .replace(/kcal/gi, "キロカロリー")
        .replace(/Lv\.?\s*(\d+)/gi, "レベル$1")
        .replace(/\+\s*(\d+)\s*EXP/gi, "プラス$1経験値")
        .replace(/EXP/gi, "経験値")
        .replace(/PFC/gi, "ピーエフシー")
        .replace(/BMR/gi, "基礎代謝")
        .replace(/P:\s*([\d.]+)\s*g/gi, "タンパク質$1グラム")
        .replace(/F:\s*([\d.]+)\s*g/gi, "脂質$1グラム")
        .replace(/C:\s*([\d.]+)\s*g/gi, "炭水化物$1グラム")
        .replace(/([\d.]+)\s*kg/gi, "$1キロ")
        .replace(/([\d.]+)\s*g/g, "$1グラム")
        .replace(/100%/g, "ひゃくパーセント")
        .replace(/(\d+)%/g, "$1パーセント")
        .replace(/[\/／]/g, "、")
        .replace(/[「」『』（）()【】]/g, "、")
        .replace(/！+/g, "！ ")
        .replace(/？+/g, "？ ")
        .replace(/…+/g, "、 ")
        .replace(/、+/g, "、")
        .trim();
    };

    // Gemini TTS が返す Raw PCM (16-bit Little Endian, 24kHz, Mono) を WAV バイナリに変換
    const convertPcmBase64ToWavArrayBuffer = (base64Pcm, sampleRate = 24000) => {
      const binaryString = atob(base64Pcm);
      const pcmLen = binaryString.length;
      const wavBuffer = new ArrayBuffer(44 + pcmLen);
      const view = new DataView(wavBuffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeStr(0, "RIFF");
      view.setUint32(4, 36 + pcmLen, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true); // PCM chunk size
      view.setUint16(20, 1, true);  // AudioFormat = 1 (Linear PCM)
      view.setUint16(22, 1, true);  // NumChannels = 1 (Mono)
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); // ByteRate
      view.setUint16(32, 2, true);  // BlockAlign
      view.setUint16(34, 16, true); // BitsPerSample
      writeStr(36, "data");
      view.setUint32(40, pcmLen, true);

      const bytes = new Uint8Array(wavBuffer, 44);
      for (let i = 0; i < pcmLen; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return wavBuffer;
    };

    // WAV ArrayBuffer を Web Audio API (または HTML5 Audio) で再生
    const playWavArrayBuffer = async (wavArrayBuffer, reqId) => {
      if (reqId !== currentSpeechRequestId) return;
      stopAllActiveAudio();

      const ctx = getOrInitAudioContext();
      if (ctx) {
        try {
          const bufferCopy = wavArrayBuffer.slice(0);
          const audioBuffer = await ctx.decodeAudioData(bufferCopy);
          if (reqId !== currentSpeechRequestId) return;
          const source = ctx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(ctx.destination);
          activeAudioSource = source;
          source.start(0);
          return;
        } catch (err) {
          console.warn("WebAudio decode fallback to HTML5 Audio:", err);
        }
      }

      // フォールバック: HTML5 Audio要素で再生
      const blob = new Blob([wavArrayBuffer], { type: "audio/wav" });
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      activeHtmlAudio = audio;
      audio.onended = () => URL.revokeObjectURL(url);
      await audio.play();
    };

    // 【アイデア2本体】Gemini API ダイレクト音声生成リクエスト
    const fetchGeminiDirectTTS = async (cleanText, buddy, apiKey) => {
      const cacheKey = `${buddy.id}__${cleanText}`;
      if (ttsAudioCache.has(cacheKey)) {
        return ttsAudioCache.get(cacheKey);
      }

      const voiceName = buddy.geminiVoice || "Zephyr";
      const ttsModels = [
        {
          model: "gemini-2.5-flash-preview-tts",
          promptText: `${buddy.voiceStylePrompt}。\n読み上げるセリフ: 「${cleanText}」`
        },
        {
          model: "gemini-2.0-flash-exp",
          promptText: `以下のセリフのみを、${buddy.voiceStylePrompt}。余計な返答は一切せずセリフだけを読み上げてください。\n「${cleanText}」`
        }
      ];

      let lastErr = null;
      for (const item of ttsModels) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${item.model}:generateContent?key=${encodeURIComponent(apiKey.trim())}`;
          const payload = {
            contents: [{ parts: [{ text: item.promptText }] }],
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: {
                    voiceName: voiceName
                  }
                }
              }
            }
          };

          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const errTxt = await res.text();
            throw new Error(`TTS HTTP ${res.status}: ${errTxt}`);
          }

          const data = await res.json();
          const parts = data?.candidates?.[0]?.content?.parts || [];
          const audioPart = parts.find((p) => p.inlineData && p.inlineData.data);

          if (!audioPart) {
            throw new Error("Audio inlineData not found in Gemini response");
          }

          const mime = audioPart.inlineData.mimeType || "audio/pcm;rate=24000";
          const rateMatch = mime.match(/rate=(\d+)/i);
          const sampleRate = rateMatch ? Number(rateMatch[1]) : 24000;

          const wavBuffer = convertPcmBase64ToWavArrayBuffer(audioPart.inlineData.data, sampleRate);
          // メモリ肥大化防止のため最大30件までキャッシュ
          if (ttsAudioCache.size > 30) {
            const firstKey = ttsAudioCache.keys().next().value;
            ttsAudioCache.delete(firstKey);
          }
          ttsAudioCache.set(cacheKey, wavBuffer);
          return wavBuffer;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("Gemini TTS failed");
    };

    // APIキー未設定時用のブラウザ内蔵TTSフォールバック
    const speakBrowserFallbackTTS = (cleanText, buddyId) => {
      if (typeof window === "undefined" || !("speechSynthesis" in window) || !cleanText) return;
      try {
        const synth = window.speechSynthesis;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = "ja-JP";
        const cfg = BUDDY_DEFINITIONS[buddyId]?.voice || { pitch: 1.0, rate: 1.0, isMale: false };
        utterance.pitch = cfg.pitch;
        utterance.rate = cfg.rate;

        const voices = synth.getVoices() || [];
        const jpVoices = voices.filter((v) => v.lang && (v.lang.includes("ja") || v.lang.includes("JP")));
        if (jpVoices.length > 0) {
          const preferred = jpVoices.find(
            (v) => v.name.includes("Natural") || v.name.includes("Online") || v.name.includes("Google") || v.name.includes("Kyoko") || v.name.includes("Otoya")
          );
          utterance.voice = preferred || jpVoices[0];
        }
        setTimeout(() => synth.speak(utterance), 40);
      } catch (e) {}
    };

    // 統合音声発話関数（Gemini APIキーがあればGemini AIリアル音声、なければブラウザTTS）
    const speakBuddyDialogue = async (text, buddyId, voiceEnabled, apiKey = "", onLoadingChange = null) => {
      if (!voiceEnabled || !text) return;
      const reqId = ++currentSpeechRequestId;
      stopAllActiveAudio();

      const cleanText = formatTextForNaturalSpeech(text);
      if (!cleanText) return;

      const buddy = BUDDY_DEFINITIONS[buddyId] || BUDDY_DEFINITIONS.riko;

      if (apiKey && apiKey.trim().length > 10) {
        try {
          if (onLoadingChange) onLoadingChange(true);
          const wavBuffer = await fetchGeminiDirectTTS(cleanText, buddy, apiKey);
          if (reqId !== currentSpeechRequestId) return;
          await playWavArrayBuffer(wavBuffer, reqId);
          return;
        } catch (err) {
          console.warn("Gemini AI TTS failed, falling back to browser speech:", err);
          if (reqId === currentSpeechRequestId) {
            speakBrowserFallbackTTS(cleanText, buddyId);
          }
        } finally {
          if (onLoadingChange && reqId === currentSpeechRequestId) {
            onLoadingChange(false);
          }
        }
      } else {
        speakBrowserFallbackTTS(cleanText, buddyId);
      }
    };

    // ==========================================
    // 3. 日付・栄養計算・画像圧縮・Geminiテキスト解析ユーティリティ
    // ==========================================
    const getJSTDateString = (dateObj = new Date()) => {
      const jstOffset = 9 * 60;
      const localOffset = dateObj.getTimezoneOffset();
      const jstTime = new Date(dateObj.getTime() + (jstOffset + localOffset) * 60000);
      const y = jstTime.getFullYear();
      const m = String(jstTime.getMonth() + 1).padStart(2, "0");
      const d = String(jstTime.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };

    const addDays = (dateStr, diff) => {
      const [y, m, d] = dateStr.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + diff);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, "0");
      const nd = String(dt.getDate()).padStart(2, "0");
      return `${ny}-${nm}-${nd}`;
    };

    const getDayOfWeekLabel = (dateStr) => {
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      const [y, m, d] = dateStr.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return days[dt.getDay()];
    };

    const generateUUID = () => {
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return "usr_" + crypto.randomUUID().slice(0, 8);
      }
      return "usr_" + Math.random().toString(36).substring(2, 10);
    };

    const calculateBMRAndTarget = (gender, weight, height, age, activityLevel) => {
      const w = Number(weight) || 60;
      const h = Number(height) || 165;
      const a = Number(age) || 35;
      const act = Number(activityLevel) || 2;

      let bmr = 0;
      if (gender === "female") {
        bmr = 655.1 + (9.563 * w) + (1.850 * h) - (4.676 * a);
      } else {
        bmr = 66.47 + (13.75 * w) + (5.003 * h) - (6.75 * a);
      }
      bmr = Math.round(bmr);

      const multipliers = { 1: 1.3, 2: 1.5, 3: 1.7 };
      const tdee = bmr * (multipliers[act] || 1.5);
      const targetCalories = Math.max(bmr, Math.round(tdee - 300));

      return { bmr, targetCalories };
    };

    const calculateTargetPFC = (targetCalories, gender) => {
      const cal = Number(targetCalories) || 1800;
      return {
        protein: Math.round((cal * 0.18) / 4),
        fat: Math.round((cal * 0.22) / 9),
        carbs: Math.round((cal * 0.60) / 4),
        salt: gender === "female" ? 6.5 : 7.5,
        fiber: 20.0
      };
    };

    const calculateLevelFromExp = (exp) => {
      const e = Number(exp) || 0;
      if (e >= 350) return 5;
      if (e >= 220) return 4;
      if (e >= 120) return 3;
      if (e >= 50) return 2;
      return 1;
    };

    const getExpProgressInfo = (exp) => {
      const e = Number(exp) || 0;
      const thresholds = [0, 50, 120, 220, 350];
      const lv = calculateLevelFromExp(e);
      if (lv === 5) {
        return { level: 5, current: e, next: 350, percent: 100 };
      }
      const start = thresholds[lv - 1];
      const next = thresholds[lv];
      const percent = Math.min(100, Math.max(0, Math.round(((e - start) / (next - start)) * 100)));
      return { level: lv, current: e, next, percent };
    };

    const compressImageToBase64 = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxSide = 800;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxSide) {
                height = Math.round((height * maxSide) / width);
                width = maxSide;
              }
            } else {
              if (height > maxSide) {
                width = Math.round((width * maxSide) / height);
                height = maxSide;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            let dataUrl = canvas.toDataURL("image/webp", 0.75);
            let mimeType = "image/webp";
            if (!dataUrl.startsWith("data:image/webp")) {
              dataUrl = canvas.toDataURL("image/jpeg", 0.75);
              mimeType = "image/jpeg";
            }
            const rawBase64 = dataUrl.replace(/^data:image\/\w+;base64,/, "");
            resolve({ dataUrl, rawBase64, mimeType });
          };
          img.onerror = () => reject(new Error("画像の読み込みに失敗しました。"));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("ファイルの読み取りに失敗しました。"));
        reader.readAsDataURL(file);
      });
    };

    const safeParseGeminiJSON = (rawText) => {
      if (!rawText) throw new Error("Empty response");
      const cleaned = rawText
        .replace(/^```json\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();
      const firstBrace = cleaned.indexOf("{");
      const lastBrace = cleaned.lastIndexOf("}");
      if (firstBrace !== -1 && lastBrace !== -1) {
        return JSON.parse(cleaned.substring(firstBrace, lastBrace + 1));
      }
      return JSON.parse(cleaned);
    };

    const callGeminiAPI = async (apiKey, systemInstruction, userPrompt, inlineImage = null) => {
      const models = ["gemini-2.0-flash", "gemini-1.5-flash"];
      let lastError = null;

      for (const model of models) {
        try {
          const url = `[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){model}:generateContent?key=${encodeURIComponent(apiKey.trim())}`;
          const parts = [{ text: userPrompt }];
          if (inlineImage && inlineImage.rawBase64) {
            parts.push({
              inline_data: {
                mime_type: inlineImage.mimeType || "image/webp",
                data: inlineImage.rawBase64
              }
            });
          }

          const body = {
            system_instruction: {
              parts: [{ text: systemInstruction }]
            },
            contents: [{ role: "user", parts }],
            generationConfig: {
              temperature: 0.7,
              responseMimeType: "application/json"
            }
          };

          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`API Error (${res.status}): ${errText}`);
          }

          const data = await res.json();
          const textOutput = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
          return safeParseGeminiJSON(textOutput);
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("Gemini API通信に失敗しました");
    };

    const generateLocalDailyAdvice = (buddy, totalCal, targetCal, actualPFC, targetPFC, isThreeMealsJustCompleted) => {
      const prefix = isThreeMealsJustCompleted ? `${buddy.threeMealsPraise} ` : "";
      if (totalCal === 0) {
        return {
          emotion: "worry",
          advice_text: `${prefix}まだ食事の記録がありませんよ。まずは今日食べたものを記録してくださいね！`,
          score: 50
        };
      }
      const diff = totalCal - targetCal;
      if (diff > 250) {
        const msgMap = {
          riko: `${prefix}ちょっとご主人様！目標より${diff}kcalもオーバーしてますよ！脂質や糖質を摂りすぎです！明日は野菜とタンパク質中心にして調整しなさいよね！`,
          jinai: `${prefix}貴様！目標を${diff}kcal超過しているぞ！たるんでいる証拠だ！明日は鶏むね肉とブロッコリーでストイックに絞り込め！`,
          allen: `${prefix}おや、目標より${diff}kcalも超過でございますね。その余分なカロリー、明日のご自身への嫌がらせでしょうか？控えめになさいませ。`,
          sora: `${prefix}わわっ、今日は${diff}kcalオーバーしちゃったね！でも大丈夫、美味しいもの食べた分、明日は野菜たっぷりで調整しよっ！`,
          shizuka: `${prefix}今日は少し美味しいものを食べすぎちゃいましたね。${diff}kcalほど超過していますので、明日は消化に優しいお野菜やスープを中心にしましょうね。`,
          selena: `${prefix}カロリー超過（+${diff}kcal）が検知されました。脂質および炭水化物の過剰摂取です。明日の摂取量を厳格に制限し是正行動を要求します。`
        };
        return { emotion: "angry", advice_text: msgMap[buddy.id] || msgMap.riko, score: 62 };
      } else if (totalCal < targetCal * 0.65) {
        const msgMap = {
          riko: `${prefix}摂取カロリーが${totalCal}kcalって少なすぎますよ！無理な絶食はリバウンドのもとです！ちゃんと栄養のあるものを食べてください！`,
          jinai: `${prefix}エネルギー不足だ（${totalCal}kcal）！筋肉まで落ちてしまうぞ！タンパク質と炭水化物をしっかり補給せよ！`,
          allen: `${prefix}旦那様、${totalCal}kcalとはいささか少なすぎます。倒れられては私の沽券に関わりますので、栄養をお摂りください。`,
          sora: `${prefix}あれれ、まだ${totalCal}kcalしか食べてないよ？無理しすぎると元気出なくなっちゃうから、しっかり栄養とってね！`,
          shizuka: `${prefix}今日は${totalCal}kcalと少し控えめすぎますね。お身体を壊さないよう、温かいスープやお豆腐などもう少し召し上がってくださいね。`,
          selena: `${prefix}摂取エネルギー不足（${totalCal}kcal）を検知。基礎代謝低下のリスクがあります。タンパク質の追加摂取を推奨します。`
        };
        return { emotion: "worry", advice_text: msgMap[buddy.id] || msgMap.riko, score: 70 };
      } else {
        const msgMap = {
          riko: `${prefix}本日の摂取は${totalCal}kcal（P:${actualPFC.protein}g / F:${actualPFC.fat}g / C:${actualPFC.carbs}g）！目標範囲内にピタッと収まってますね！べ、別に褒めてあげなくもないですよ！`,
          jinai: `${prefix}本日の摂取${totalCal}kcal！理想的なカロリーコントロールだ！タンパク質も意識できており実に素晴らしい！この調子で突き進め！`,
          allen: `${prefix}本日の摂取${totalCal}kcal、目標範囲内で実に美しい栄養管理でございますね。お見事です、旦那様。`,
          sora: `${prefix}やったね！${totalCal}kcalで目標バッチリクリアだよ！栄養バランスもイイ感じだし、この調子で楽しく続けようね！`,
          shizuka: `${prefix}本日の摂取は${totalCal}kcal、目標通りでとっても素晴らしいバランスですね。毎日丁寧にお食事を選ばれていて素敵ですよ。`,
          selena: `${prefix}本日の摂取${totalCal}kcal。目標値との整合性を確認。PFCバランスも許容範囲内であり、極めて優秀な自己管理と評価します。`
        };
        return { emotion: "smile", advice_text: msgMap[buddy.id] || msgMap.riko, score: 92 };
      }
    };

    // ==========================================
    // 4. キャラクター立ち絵 & フォールバックSVGアバター
    // ==========================================
    const BuddyAvatar = ({ buddy, emotion = "neutral", level = 1, expPercent = 0, onClick, size = "md" }) => {
      const [imgError, setImgError] = useState(false);
      const assetPath = buddy?.assets?.[emotion] || buddy?.assets?.neutral;

      useEffect(() => {
        setImgError(false);
      }, [buddy?.id, emotion]);

      const meta = EMOTION_META[emotion] || EMOTION_META.neutral;
      const sizeClasses = size === "lg" ? "w-28 h-28" : size === "sm" ? "w-14 h-14" : "w-24 h-24";

      return (
        <div
          onClick={onClick}
          className="flex flex-col items-center cursor-pointer select-none group relative"
          title="タップして会話する"
        >
          <div
            className={`${sizeClasses} rounded-2xl relative flex items-center justify-center shadow-md transition-transform active:scale-95 overflow-hidden border-2`}
            style={{
              borderColor: buddy.themeColor,
              background: `linear-gradient(145deg, #ffffff 0%, ${buddy.lightBg || "#f3f4f6"} 100%)`
            }}
          >
            {!imgError && assetPath ? (
              <img
                src={assetPath}
                alt={buddy.name}
                onError={() => setImgError(true)}
                className="w-full h-full object-cover"
              />
            ) : (
              <svg viewBox="0 0 120 120" className="w-full h-full">
                <defs>
                  <radialGradient id={`grad-${buddy.id}`} cx="50%" cy="40%" r="60%">
                    <stop offset="0%" stopColor="#ffffff" />
                    <stop offset="100%" stopColor={buddy.themeColor} stopOpacity="0.22" />
                  </radialGradient>
                </defs>
                <rect width="120" height="120" fill={`url(#grad-${buddy.id})`} />
                <circle cx="60" cy="52" r="34" fill="#ffffff" stroke={buddy.themeColor} strokeWidth="3" />
                <text x="60" y="54" textAnchor="middle" dominantBaseline="central" fontSize="30">
                  {buddy.emoji}
                </text>
                <circle cx="90" cy="26" r="14" fill="#ffffff" stroke={buddy.themeColor} strokeWidth="2" />
                <text x="90" y="27" textAnchor="middle" dominantBaseline="central" fontSize="16">
                  {meta.face}
                </text>
                <rect x="14" y="92" width="92" height="20" rx="10" fill={buddy.themeColor} />
                <text x="60" y="103" textAnchor="middle" dominantBaseline="central" fill="#ffffff" fontSize="11" fontWeight="bold">
                  {buddy.name} ({meta.label})
                </text>
              </svg>
            )}

            <div
              className="absolute top-1 left-1 px-1.5 py-0.5 rounded-md text-[10px] font-bold text-white shadow"
              style={{ backgroundColor: buddy.themeColor }}
            >
              Lv.{level} {level >= 5 ? "👑" : ""}
            </div>
          </div>

          <div className="w-24 mt-1.5">
            <div className="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
              <div
                className="h-full transition-all duration-300"
                style={{ width: `${expPercent}%`, backgroundColor: buddy.themeColor }}
              />
            </div>
            <div className="text-[10px] text-center text-gray-500 font-medium mt-0.5">
              タップで会話 💬
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 5. 初期設定＆プロフィール編集モーダル（Gemini AI音声試聴機能つき）
    // ==========================================
    const ProfileOnboardingModal = ({ isOpen, initialData, isForced, onSave, onClose }) => {
      if (!isOpen) return null;

      const profile = initialData?.user_profile || {};
      const [apiKey, setApiKey] = useState(initialData?.api_key || "");
      const [nickname, setNickname] = useState(profile.nickname || "");
      const [gender, setGender] = useState(profile.gender || "male");
      const [age, setAge] = useState(profile.age || 35);
      const [height, setHeight] = useState(profile.height || 170);
      const [currentWeight, setCurrentWeight] = useState(profile.current_weight || 68);
      const [targetWeight, setTargetWeight] = useState(profile.target_weight || 62);
      const [activityLevel, setActivityLevel] = useState(profile.activity_level || 2);
      const [selectedBuddy, setSelectedBuddy] = useState(profile.selected_buddy || "riko");
      const [isTestingVoice, setIsTestingVoice] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");

      const previewCalc = useMemo(() => {
        return calculateBMRAndTarget(gender, currentWeight, height, age, activityLevel);
      }, [gender, currentWeight, height, age, activityLevel]);

      const previewPFC = useMemo(() => {
        return calculateTargetPFC(previewCalc.targetCalories, gender);
      }, [previewCalc.targetCalories, gender]);

      const handleTestGeminiVoice = () => {
        unlockSpeechSynthesis();
        const b = BUDDY_DEFINITIONS[selectedBuddy] || BUDDY_DEFINITIONS.riko;
        const sampleText = b.quotes[1][0];
        speakBuddyDialogue(sampleText, b.id, true, apiKey.trim(), setIsTestingVoice);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        unlockSpeechSynthesis();
        if (!nickname.trim()) {
          setErrorMsg("ニックネームを入力してください。");
          return;
        }
        const h = Number(height);
        const w = Number(currentWeight);
        const tw = Number(targetWeight);
        const a = Number(age);
        if (h < 100 || h > 250 || w < 25 || w > 250 || a < 10 || a > 120) {
          setErrorMsg("身長・体重・年齢の数値が正しくありません。");
          return;
        }

        onSave({
          apiKey: apiKey.trim(),
          nickname: nickname.trim(),
          gender,
          age: a,
          height: h,
          currentWeight: w,
          targetWeight: tw,
          activityLevel: Number(activityLevel),
          bmr: previewCalc.bmr,
          targetCalories: previewCalc.targetCalories,
          selectedBuddy
        });
      };

      const activeBuddyObj = BUDDY_DEFINITIONS[selectedBuddy] || BUDDY_DEFINITIONS.riko;

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 overflow-y-auto">
          <div className="bg-white w-full max-w-[410px] rounded-2xl shadow-2xl p-5 my-auto animate-pop max-h-[92vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b pb-3 mb-4">
              <div>
                <span className="text-xs font-bold text-emerald-600 block">AIコンパニオンと</span>
                <h2 className="text-lg font-extrabold text-gray-800">
                  {isForced ? "🎉 はじめにプロフィール設定" : "⚙️ プロフィール・AI音声設定"}
                </h2>
              </div>
              {!isForced && (
                <button
                  onClick={onClose}
                  className="text-gray-400 hover:text-gray-600 p-1 text-xl font-bold"
                >
                  ✕
                </button>
              )}
            </div>

            {errorMsg && (
              <div className="mb-3 p-2.5 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg font-medium">
                ⚠️ {errorMsg}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3.5 text-sm">
              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">
                  ニックネーム <span className="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  value={nickname}
                  onChange={(e) => setNickname(e.target.value)}
                  placeholder="例: たかのり"
                  className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  required
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">性別</label>
                  <select
                    value={gender}
                    onChange={(e) => setGender(e.target.value)}
                    className="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white"
                  >
                    <option value="male">男性</option>
                    <option value="female">女性</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">年齢 (歳)</label>
                  <input
                    type="number"
                    value={age}
                    onChange={(e) => setAge(e.target.value)}
                    className="w-full border border-gray-300 rounded-lg px-3 py-2"
                    min="10"
                    max="110"
                    required
                  />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2.5">
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">身長 (cm)</label>
                  <input
                    type="number"
                    step="0.1"
                    value={height}
                    onChange={(e) => setHeight(e.target.value)}
                    className="w-full border border-gray-300 rounded-lg px-2.5 py-2"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">現在体重 (kg)</label>
                  <input
                    type="number"
                    step="0.1"
                    value={currentWeight}
                    onChange={(e) => setCurrentWeight(e.target.value)}
                    className="w-full border border-gray-300 rounded-lg px-2.5 py-2"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">目標体重 (kg)</label>
                  <input
                    type="number"
                    step="0.1"
                    value={targetWeight}
                    onChange={(e) => setTargetWeight(e.target.value)}
                    className="w-full border border-gray-300 rounded-lg px-2.5 py-2"
                    required
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">普段の活動レベル</label>
                <select
                  value={activityLevel}
                  onChange={(e) => setActivityLevel(Number(e.target.value))}
                  className="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white text-xs"
                >
                  <option value={1}>レベル1: 低い（デスクワーク中心・運動少なめ）</option>
                  <option value={2}>レベル2: 普通（立ち仕事や移動あり・軽い運動）</option>
                  <option value={3}>レベル3: 高い（活発な運動習慣・肉体労働）</option>
                </select>
              </div>

              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs space-y-1">
                <div className="font-bold text-emerald-800 flex items-center justify-between">
                  <span>📊 自動算出された目標値</span>
                  <span className="text-[11px] bg-white px-2 py-0.5 rounded text-emerald-700 border border-emerald-200">
                    基礎代謝割れ防止適用
                  </span>
                </div>
                <div className="flex justify-between text-gray-700 pt-1">
                  <span>基礎代謝量 (BMR): <strong>{previewCalc.bmr}</strong> kcal</span>
                  <span>目標摂取: <strong className="text-emerald-700 text-sm">{previewCalc.targetCalories}</strong> kcal</span>
                </div>
                <div className="text-[11px] text-gray-600 pt-0.5">
                  理想PFC: P {previewPFC.protein}g / F {previewPFC.fat}g / C {previewPFC.carbs}g
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1.5">
                  担当AIコンパニオン（各キャラ固有のGemini AIボイス割当済）
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {Object.values(BUDDY_DEFINITIONS).map((b) => {
                    const active = selectedBuddy === b.id;
                    return (
                      <button
                        type="button"
                        key={b.id}
                        onClick={() => setSelectedBuddy(b.id)}
                        className={`p-2 rounded-xl border text-left transition flex flex-col items-center ${
                          active
                            ? "border-2 bg-emerald-50/60 shadow-xs"
                            : "border-gray-200 bg-white hover:bg-gray-50"
                        }`}
                        style={{ borderColor: active ? b.themeColor : undefined }}
                      >
                        <span className="text-xl">{b.emoji}</span>
                        <span className="font-bold text-xs mt-0.5 text-gray-800">{b.name}</span>
                        <span className="text-[10px] text-gray-500">{b.role}</span>
                        <span className="text-[9px] text-indigo-600 font-mono mt-0.5">🎙️ {b.geminiVoice}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Gemini APIキー & ダイレクトAI音声試聴 */}
              <div className="bg-indigo-50/60 border border-indigo-200 rounded-xl p-3 space-y-2">
                <div className="flex items-center justify-between">
                  <label className="block text-xs font-bold text-indigo-900">
                    🔑 Gemini API キー（AI音声生成＆写真解析）
                  </label>
                  <button
                    type="button"
                    disabled={isTestingVoice}
                    onClick={handleTestGeminiVoice}
                    className="text-[11px] bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white font-bold px-2.5 py-1 rounded-lg transition shadow-2xs"
                  >
                    {isTestingVoice ? "🎙️ AI音声生成中..." : `🔈 ${activeBuddyObj.name}のAI声を試聴`}
                  </button>
                </div>
                <input
                  type="password"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  placeholder="AIzaSy... を入力するとリアルなAI声優ボイスで喋ります"
                  className="w-full border border-indigo-200 rounded-lg px-3 py-2 text-xs font-mono bg-white"
                />
                <p className="text-[10px] text-indigo-700 leading-relaxed">
                  ※APIキーを入力すると、機械的なブラウザ音声ではなく <strong>Gemini 2.5 Native TTS（{activeBuddyObj.geminiVoice} ボイス）</strong> で感情豊かに喋ります。
                </p>
              </div>

              <button
                type="submit"
                className="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow-md transition text-sm"
              >
                {isForced ? "この設定でダイエットを始める！" : "設定を保存する"}
              </button>
            </form>
          </div>
        </div>
      );
    };

    // ==========================================
    // 6. 食事記録モーダル
    // ==========================================
    const MealRecordModal = ({
      isOpen,
      onClose,
      initialMealType,
      initialMode,
      selectedDate,
      buddy,
      buddyLevel,
      targetCalories,
      consumedCalories,
      apiKey,
      onSaveMeal
    }) => {
      if (!isOpen) return null;

      const [mealType, setMealType] = useState(initialMealType || "lunch");
      const [mode, setMode] = useState(initialMode || "manual");
      const [menuName, setMenuName] = useState("");
      const [calories, setCalories] = useState("");
      const [protein, setProtein] = useState("");
      const [fat, setFat] = useState("");
      const [carbs, setCarbs] = useState("");
      const [salt, setSalt] = useState("");
      const [fiber, setFiber] = useState("");

      const [imagePreview, setImagePreview] = useState(null);
      const [compressedImg, setCompressedImg] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [aiReaction, setAiReaction] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");

      const handleFileChange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setErrorMsg("");
        try {
          const result = await compressImageToBase64(file);
          setImagePreview(result.dataUrl);
          setCompressedImg(result);
        } catch (err) {
          setErrorMsg(err.message || "画像の処理に失敗しました。");
        }
      };

      const handleAnalyzePhoto = async () => {
        unlockSpeechSynthesis();
        if (!compressedImg) {
          setErrorMsg("先に食事の写真を選択してください。");
          return;
        }
        if (!apiKey) {
          setErrorMsg("写真AI解析には設定画面からGemini APIキーの登録が必要です。下のフォームから手動入力も可能です。");
          return;
        }

        setIsAnalyzing(true);
        setErrorMsg("");

        const sysInst = `あなたはダイエットバディ「${buddy.name}」です。設定: ${buddy.systemPrompt}
1日目標: ${targetCalories} kcal / 現在摂取: ${consumedCalories} kcal / 親愛度: Lv.${buddyLevel}`;

        const taskPrompt = `画像を解析し、食べ物でない場合は "is_food": false としツッコミを入れてください。
食べ物の場合は1人前の栄養素を推定し、バディ口調のリアクションを出力してください。
必ず以下のJSON形式のみで出力してください:
{
  "is_food": true,
  "menu_items": ["料理名1"],
  "total_nutrition": { "calories": 650, "protein": 22.5, "fat": 18.0, "carbs": 80.0, "salt_equivalent": 2.1, "fiber": 3.0 },
  "buddy_reaction": { "emotion": "smile", "dialogue": "100字前後のコメント" }
}`;

        try {
          const parsed = await callGeminiAPI(apiKey, sysInst, taskPrompt, compressedImg);
          if (parsed.is_food === false) {
            setAiReaction({
              emotion: parsed?.buddy_reaction?.emotion || "angry",
              dialogue: parsed?.buddy_reaction?.dialogue || "これは食べ物じゃないですよ！ちゃんと食事の写真を撮ってください！"
            });
            setErrorMsg("食べ物として認識されませんでした。手動で修正するか別の写真をお試しください。");
          } else {
            const items = Array.isArray(parsed.menu_items) ? parsed.menu_items.join("・") : "AI解析メニュー";
            const nut = parsed.total_nutrition || {};
            setMenuName(items);
            setCalories(String(Math.round(Number(nut.calories) || 500)));
            setProtein(String(Number(nut.protein ?? 18).toFixed(1)));
            setFat(String(Number(nut.fat ?? 15).toFixed(1)));
            setCarbs(String(Number(nut.carbs ?? 65).toFixed(1)));
            setSalt(String(Number(nut.salt_equivalent ?? 2.0).toFixed(1)));
            setFiber(String(Number(nut.fiber ?? 3.0).toFixed(1)));
            setAiReaction({
              emotion: parsed?.buddy_reaction?.emotion || "smile",
              dialogue: parsed?.buddy_reaction?.dialogue || `${items}ですね！しっかり記録しましたよ！`
            });
          }
        } catch (err) {
          setErrorMsg("AI解析に失敗しました（" + (err.message || "通信エラー") + "）。数値を直接入力して保存できます。");
        } finally {
          setIsAnalyzing(false);
        }
      };

      const applyQuickPreset = (preset) => {
        setMenuName(preset.name);
        setCalories(String(preset.cal));
        setProtein(String(preset.p));
        setFat(String(preset.f));
        setCarbs(String(preset.c));
        setSalt(String(preset.s));
        setFiber(String(preset.fib));
      };

      const handleSave = (e) => {
        e.preventDefault();
        unlockSpeechSynthesis();
        if (!menuName.trim()) {
          setErrorMsg("メニュー名を入力してください。");
          return;
        }
        const calNum = Math.max(0, Math.round(Number(calories) || 0));
        if (calNum <= 0) {
          setErrorMsg("カロリーを1以上で入力してください。");
          return;
        }

        const pNum = protein !== "" ? Number(protein) : Math.round((calNum * 0.16) / 4 * 10) / 10;
        const fNum = fat !== "" ? Number(fat) : Math.round((calNum * 0.25) / 9 * 10) / 10;
        const cNum = carbs !== "" ? Number(carbs) : Math.round((calNum * 0.59) / 4 * 10) / 10;
        const sNum = salt !== "" ? Number(salt) : 1.8;
        const fibNum = fiber !== "" ? Number(fiber) : 2.5;

        let emotion = aiReaction?.emotion || "smile";
        let comment = aiReaction?.dialogue || "";
        if (!comment) {
          if (calNum >= 850) {
            emotion = "angry";
            comment = `${menuName.trim()}（${calNum}kcal）を記録しました！少しカロリー高めですから、次の食事で野菜中心に調整しましょうね！`;
          } else {
            emotion = "smile";
            comment = `${menuName.trim()}（${calNum}kcal）を記録しましたよ！コツコツ記録できてえらいです！`;
          }
        }

        onSaveMeal({
          meal_id: "meal_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          date: selectedDate,
          meal_type: mealType,
          timestamp: new Date().toISOString(),
          menu_names: [menuName.trim()],
          calories: calNum,
          protein: Number(pNum.toFixed(1)),
          fat: Number(fNum.toFixed(1)),
          carbs: Number(cNum.toFixed(1)),
          salt: Number(sNum.toFixed(1)),
          fiber: Number(fibNum.toFixed(1)),
          buddy_emotion: emotion,
          buddy_comment: comment
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-3">
          <div className="bg-white w-full max-w-[430px] rounded-t-2xl sm:rounded-2xl shadow-2xl p-4 max-h-[92vh] overflow-y-auto animate-pop">
            <div className="flex items-center justify-between border-b pb-2.5 mb-3">
              <div>
                <span className="text-[11px] text-gray-500 font-bold">{selectedDate} の食事記録</span>
                <h3 className="text-base font-extrabold text-gray-800 flex items-center gap-1.5">
                  <span>🍽️ 食事を記録する</span>
                  <span className="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">
                    +10 EXP
                  </span>
                </h3>
              </div>
              <button
                onClick={onClose}
                className="text-gray-400 hover:text-gray-600 p-1 text-xl font-bold"
              >
                ✕
              </button>
            </div>

            <div className="grid grid-cols-4 gap-1.5 mb-3">
              {MEAL_TYPES.map((mt) => (
                <button
                  type="button"
                  key={mt.key}
                  onClick={() => setMealType(mt.key)}
                  className={`py-2 rounded-xl text-xs font-bold border transition flex flex-col items-center ${
                    mealType === mt.key
                      ? "bg-emerald-600 text-white border-emerald-600 shadow-xs"
                      : "bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100"
                  }`}
                >
                  <span className="text-base">{mt.icon}</span>
                  <span>{mt.label}</span>
                </button>
              ))}
            </div>

            <div className="grid grid-cols-2 gap-2 bg-gray-100 p-1 rounded-xl mb-3">
              <button
                type="button"
                onClick={() => setMode("photo")}
                className={`py-2 rounded-lg text-xs font-bold transition ${
                  mode === "photo"
                    ? "bg-white text-emerald-700 shadow-xs"
                    : "text-gray-600 hover:text-gray-800"
                }`}
              >
                📷 写真でAI解析
              </button>
              <button
                type="button"
                onClick={() => setMode("manual")}
                className={`py-2 rounded-lg text-xs font-bold transition ${
                  mode === "manual"
                    ? "bg-white text-emerald-700 shadow-xs"
                    : "text-gray-600 hover:text-gray-800"
                }`}
              >
                ✏️ 手動で直接入力
              </button>
            </div>

            {errorMsg && (
              <div className="mb-3 p-2.5 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg">
                ⚠️ {errorMsg}
              </div>
            )}

            {mode === "photo" && (
              <div className="mb-4 p-3 bg-gray-50 border border-dashed border-gray-300 rounded-xl space-y-2.5">
                <label className="block w-full cursor-pointer">
                  <div className="flex flex-col items-center justify-center py-3 px-2 bg-white rounded-lg border border-gray-200 hover:bg-emerald-50/40 transition">
                    {imagePreview ? (
                      <img
                        src={imagePreview}
                        alt="preview"
                        className="max-h-40 rounded-lg object-contain mb-2"
                      />
                    ) : (
                      <div className="text-center py-2">
                        <div className="text-3xl mb-1">📸</div>
                        <div className="text-xs font-bold text-gray-700">タップして料理の写真を選択・撮影</div>
                        <div className="text-[10px] text-gray-400">長辺800px WebPへ自動圧縮されます</div>
                      </div>
                    )}
                    <input
                      type="file"
                      accept="image/*"
                      capture="environment"
                      onChange={handleFileChange}
                      className="hidden"
                    />
                  </div>
                </label>

                <button
                  type="button"
                  disabled={!compressedImg || isAnalyzing}
                  onClick={handleAnalyzePhoto}
                  className={`w-full py-2.5 rounded-xl font-bold text-xs text-white transition flex items-center justify-center gap-1.5 ${
                    !compressedImg || isAnalyzing
                      ? "bg-gray-300 cursor-not-allowed"
                      : "bg-indigo-600 hover:bg-indigo-700 shadow"
                  }`}
                >
                  {isAnalyzing ? (
                    <span>⏳ {buddy.name}が写真をAI解析中...</span>
                  ) : (
                    <span>✨ AIでカロリー・栄養素を自動推定する</span>
                  )}
                </button>

                {aiReaction && (
                  <div className="p-2.5 bg-white rounded-lg border border-emerald-200 text-xs text-gray-700 flex gap-2 items-start">
                    <span className="text-lg">{buddy.emoji}</span>
                    <div>
                      <div className="font-bold text-emerald-700 text-[11px]">{buddy.name}のAI解析コメント:</div>
                      <div>{aiReaction.dialogue}</div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {mode === "manual" && (
              <div className="mb-3">
                <div className="text-[11px] font-bold text-gray-500 mb-1">💡 ワンタップ入力プリセット（任意）:</div>
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                  {[
                    { name: "トースト＆ゆで卵・コーヒー", cal: 340, p: 14.5, f: 11.0, c: 44.0, s: 1.3, fib: 2.2 },
                    { name: "おにぎり2個＆味噌汁", cal: 410, p: 10.2, f: 3.5, c: 82.0, s: 2.4, fib: 3.0 },
                    { name: "鶏むねサラダ＆玄米定食", cal: 520, p: 36.0, f: 9.5, c: 68.0, s: 2.0, fib: 5.5 },
                    { name: "パリパリピーマンのキーマカレー乗せ", cal: 580, p: 24.5, f: 21.0, c: 70.0, s: 2.5, fib: 4.8 },
                    { name: "プロテイン＆素焼きミックスナッツ(35g)", cal: 315, p: 26.0, f: 18.5, c: 11.0, s: 0.2, fib: 2.8 }
                  ].map((p, idx) => (
                    <button
                      type="button"
                      key={idx}
                      onClick={() => applyQuickPreset(p)}
                      className="shrink-0 text-[11px] bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 px-2.5 py-1 rounded-full font-medium"
                    >
                      +{p.name} ({p.cal}kcal)
                    </button>
                  ))}
                </div>
              </div>
            )}

            <form onSubmit={handleSave} className="space-y-3 text-xs">
              <div>
                <label className="block font-bold text-gray-700 mb-1">
                  メニュー名 <span className="text-red-500">*</span>
                  {mode === "photo" && <span className="text-[10px] text-gray-400 ml-1">（解析後に手動修正可能）</span>}
                </label>
                <input
                  type="text"
                  value={menuName}
                  onChange={(e) => setMenuName(e.target.value)}
                  placeholder="例: 鮭塩焼き定食、サラダチキンなど"
                  className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  required
                />
              </div>

              <div>
                <label className="block font-bold text-gray-700 mb-1">
                  カロリー (kcal) <span className="text-red-500">*</span>
                </label>
                <input
                  type="number"
                  value={calories}
                  onChange={(e) => setCalories(e.target.value)}
                  placeholder="例: 550"
                  className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  min="1"
                  max="5000"
                  required
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <span className="font-bold text-gray-700">PFC・栄養素（任意 / 空欄時は自動概算）</span>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-[11px] text-gray-500">タンパク質 P (g)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={protein}
                      onChange={(e) => setProtein(e.target.value)}
                      placeholder="自動"
                      className="w-full border border-gray-300 rounded-lg px-2 py-1.5"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-gray-500">脂質 F (g)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={fat}
                      onChange={(e) => setFat(e.target.value)}
                      placeholder="自動"
                      className="w-full border border-gray-300 rounded-lg px-2 py-1.5"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-gray-500">炭水化物 C (g)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={carbs}
                      onChange={(e) => setCarbs(e.target.value)}
                      placeholder="自動"
                      className="w-full border border-gray-300 rounded-lg px-2 py-1.5"
                    />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2 mt-2">
                  <div>
                    <label className="block text-[11px] text-gray-500">食塩相当量 (g)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={salt}
                      onChange={(e) => setSalt(e.target.value)}
                      placeholder="1.8"
                      className="w-full border border-gray-300 rounded-lg px-2 py-1.5"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-gray-500">食物繊維 (g)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={fiber}
                      onChange={(e) => setFiber(e.target.value)}
                      placeholder="2.5"
                      className="w-full border border-gray-300 rounded-lg px-2 py-1.5"
                    />
                  </div>
                </div>
              </div>

              <div className="pt-2 flex gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="w-1/3 py-2.5 rounded-xl border border-gray-300 text-gray-600 font-bold"
                >
                  キャンセル
                </button>
                <button
                  type="submit"
                  className="w-2/3 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-md"
                >
                  記録を保存する (+10 EXP)
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // ==========================================
    // 7. 週間分析レポート＆バディ交代モーダル
    // ==========================================
    const WeeklyReportModal = ({
      isOpen,
      onClose,
      appData,
      selectedDate,
      onSwitchBuddy,
      onUpdateBuddySpeech
    }) => {
      const radarCanvasRef = useRef(null);
      const lineCanvasRef = useRef(null);
      const radarChartInstance = useRef(null);
      const lineChartInstance = useRef(null);

      const [isAnalyzingWeekly, setIsAnalyzingWeekly] = useState(false);
      const [weeklyReviewData, setWeeklyReviewData] = useState(null);

      const profile = appData.user_profile;
      const currentBuddy = BUDDY_DEFINITIONS[profile?.selected_buddy] || BUDDY_DEFINITIONS.riko;
      const targetPFC = calculateTargetPFC(profile?.target_calories || 2000, profile?.gender || "male");

      const weeklyStats = useMemo(() => {
        const dates = [];
        for (let i = 6; i >= 0; i--) {
          dates.push(addDays(selectedDate, -i));
        }

        let recordedDaysCount = 0;
        let sumCal = 0;
        let sumP = 0;
        let sumF = 0;
        let sumC = 0;
        let sumSalt = 0;
        let sumFiber = 0;
        const allMenus = [];

        dates.forEach((d) => {
          const dayMeals = (appData.meal_history || []).filter((m) => m.date === d);
          if (dayMeals.length > 0) {
            recordedDaysCount++;
            dayMeals.forEach((m) => {
              sumCal += Number(m.calories) || 0;
              sumP += Number(m.protein) || 0;
              sumF += Number(m.fat) || 0;
              sumC += Number(m.carbs) || 0;
              sumSalt += Number(m.salt) || 0;
              sumFiber += Number(m.fiber) || 0;
              if (Array.isArray(m.menu_names)) {
                allMenus.push(...m.menu_names);
              }
            });
          }
        });

        const denom = recordedDaysCount > 0 ? recordedDaysCount : 1;
        const avgCal = recordedDaysCount > 0 ? Math.round(sumCal / denom) : 0;
        const avgP = recordedDaysCount > 0 ? Math.round((sumP / denom) * 10) / 10 : 0;
        const avgF = recordedDaysCount > 0 ? Math.round((sumF / denom) * 10) / 10 : 0;
        const avgC = recordedDaysCount > 0 ? Math.round((sumC / denom) * 10) / 10 : 0;
        const avgSalt = recordedDaysCount > 0 ? Math.round((sumSalt / denom) * 10) / 10 : 0;
        const avgFiber = recordedDaysCount > 0 ? Math.round((sumFiber / denom) * 10) / 10 : 0;

        const targetCal = profile?.target_calories || 2000;
        const rateCal = targetCal > 0 ? Math.min(150, Math.round((avgCal / targetCal) * 100)) : 0;
        const rateP = targetPFC.protein > 0 ? Math.min(150, Math.round((avgP / targetPFC.protein) * 100)) : 0;
        const rateF = targetPFC.fat > 0 ? Math.min(150, Math.round((avgF / targetPFC.fat) * 100)) : 0;
        const rateC = targetPFC.carbs > 0 ? Math.min(150, Math.round((avgC / targetPFC.carbs) * 100)) : 0;
        const rateFiber = targetPFC.fiber > 0 ? Math.min(150, Math.round((avgFiber / targetPFC.fiber) * 100)) : 0;

        return {
          dates,
          recordedDaysCount,
          avgCal,
          avgP,
          avgF,
          avgC,
          avgSalt,
          avgFiber,
          rateCal,
          rateP,
          rateF,
          rateC,
          rateFiber,
          sampleMenus: allMenus.slice(-12)
        };
      }, [appData.meal_history, selectedDate, profile?.target_calories, targetPFC]);

      useEffect(() => {
        if (!isOpen || !profile) return;

        if (radarCanvasRef.current) {
          if (radarChartInstance.current) {
            radarChartInstance.current.destroy();
          }
          const ctxR = radarCanvasRef.current.getContext("2d");
          radarChartInstance.current = new Chart(ctxR, {
            type: "radar",
            data: {
              labels: ["カロリー", "タンパク質(P)", "脂質(F)", "炭水化物(C)", "食物繊維"],
              datasets: [
                {
                  label: "7日間平均達成率(%)",
                  data: [
                    weeklyStats.rateCal,
                    weeklyStats.rateP,
                    weeklyStats.rateF,
                    weeklyStats.rateC,
                    weeklyStats.rateFiber
                  ],
                  backgroundColor: "rgba(16, 185, 129, 0.25)",
                  borderColor: "#10b981",
                  pointBackgroundColor: "#059669",
                  borderWidth: 2
                },
                {
                  label: "理想基準(100%)",
                  data: [100, 100, 100, 100, 100],
                  backgroundColor: "rgba(156, 163, 175, 0.08)",
                  borderColor: "#9ca3af",
                  borderDash: [4, 4],
                  pointRadius: 0,
                  borderWidth: 1.5
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                r: {
                  min: 0,
                  max: 150,
                  ticks: { stepSize: 50, font: { size: 10 } }
                }
              },
              plugins: {
                legend: { labels: { font: { size: 11 } } }
              }
            }
          });
        }

        if (lineCanvasRef.current) {
          if (lineChartInstance.current) {
            lineChartInstance.current.destroy();
          }
          const sortedWeights = [...(appData.weight_history || [])].sort((a, b) =>
            a.date.localeCompare(b.date)
          );
          const recentWeights = sortedWeights.slice(-14);

          const labels = recentWeights.length > 0
            ? recentWeights.map((w) => w.date.slice(5))
            : [selectedDate.slice(5)];
          const dataPoints = recentWeights.length > 0
            ? recentWeights.map((w) => Number(w.weight) || profile.current_weight)
            : [Number(profile.current_weight) || 65];
          const targetLine = labels.map(() => Number(profile.target_weight) || 60);

          const ctxL = lineCanvasRef.current.getContext("2d");
          lineChartInstance.current = new Chart(ctxL, {
            type: "line",
            data: {
              labels,
              datasets: [
                {
                  label: "記録体重 (kg)",
                  data: dataPoints,
                  borderColor: currentBuddy.themeColor || "#10b981",
                  backgroundColor: "rgba(16, 185, 129, 0.15)",
                  tension: 0.25,
                  fill: true,
                  pointRadius: 4
                },
                {
                  label: "目標体重 (kg)",
                  data: targetLine,
                  borderColor: "#f59e0b",
                  borderDash: [5, 5],
                  pointRadius: 0,
                  borderWidth: 1.5,
                  fill: false
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { labels: { font: { size: 11 } } }
              },
              scales: {
                y: {
                  ticks: { font: { size: 10 } }
                },
                x: {
                  ticks: { font: { size: 10 } }
                }
              }
            }
          });
        }

        return () => {
          if (radarChartInstance.current) {
            radarChartInstance.current.destroy();
            radarChartInstance.current = null;
          }
          if (lineChartInstance.current) {
            lineChartInstance.current.destroy();
            lineChartInstance.current = null;
          }
        };
      }, [isOpen, weeklyStats, appData.weight_history, profile, currentBuddy]);

      if (!isOpen || !profile) return null;

      const handleAnalyzeWeekly = async () => {
        unlockSpeechSynthesis();
        setIsAnalyzingWeekly(true);
        const lv = calculateLevelFromExp(appData.buddy_progress?.[currentBuddy.id]?.exp || 0);

        if (appData.api_key && weeklyStats.recordedDaysCount > 0) {
          try {
            const sysInst = `あなたはダイエットバディ「${currentBuddy.name}」です。設定: ${currentBuddy.systemPrompt} / 親愛度Lv.${lv}`;
            const prompt = `直近7日間の食事記録データを分析し、バディ口調で週間総評を行ってください。
- 記録日数: 7日中 ${weeklyStats.recordedDaysCount}日
- 平均摂取カロリー: ${weeklyStats.avgCal} kcal (目標: ${profile.target_calories} kcal)
- 平均PFC: P:${weeklyStats.avgP}g / F:${weeklyStats.avgF}g / C:${weeklyStats.avgC}g
- 平均塩分: ${weeklyStats.avgSalt}g / 平均食物繊維: ${weeklyStats.avgFiber}g
- 現在体重: ${profile.current_weight}kg (目標体重: ${profile.target_weight}kg)
- 主な記録メニュー: ${weeklyStats.sampleMenus.join("、") || "なし"}

以下のJSONスキーマのみで出力してください:
{
  "emotion": "smile",
  "weekly_review": "バディ口調での1週間の総評と来週への具体的アドバイス（200〜250字）",
  "good_point": "今週の良かった点（1行）",
  "improve_point": "来週の改善ターゲット（1行）"
}`;
            const res = await callGeminiAPI(appData.api_key, sysInst, prompt);
            const reviewObj = {
              emotion: res.emotion || "smile",
              weekly_review: res.weekly_review || "1週間の記録お疲れ様でした！",
              good_point: res.good_point || `7日中${weeklyStats.recordedDaysCount}日の記録を継続できた点`,
              improve_point: res.improve_point || "食物繊維とタンパク質のさらなる意識"
            };
            setWeeklyReviewData(reviewObj);
            onUpdateBuddySpeech(reviewObj.weekly_review, reviewObj.emotion, true);
            setIsAnalyzingWeekly(false);
            return;
          } catch (err) {
            console.warn("Weekly AI fallback:", err);
          }
        }

        const fallbackReview = weeklyStats.recordedDaysCount === 0
          ? {
              emotion: "worry",
              weekly_review: `直近7日間の食事記録がまだ0件ですよ！まずは今日のご飯から1日1食でも記録を始めて、一緒にペースを作っていきましょうね！`,
              good_point: "レポート画面を開いて現状を確認できたこと",
              improve_point: "まずは3日間連続で食事を記録すること"
            }
          : {
              emotion: "smile",
              weekly_review: `直近7日間で${weeklyStats.recordedDaysCount}日しっかり記録できましたね！平均摂取カロリーは${weeklyStats.avgCal}kcal（目標${profile.target_calories}kcal）、平均タンパク質は${weeklyStats.avgP}gです。${
                weeklyStats.avgFiber < 15
                  ? "来週はきのこや海藻類をプラスして食物繊維をもう少し増やすと、さらに理想の身体に近づけますよ！"
                  : "栄養バランスも非常に安定しています。来週もこの調子で一緒に走り抜けましょう！"
              }`,
              good_point: `7日間で${weeklyStats.recordedDaysCount}日記録を継続し、平均${weeklyStats.avgCal}kcalにコントロールできた点`,
              improve_point: weeklyStats.avgSalt > 7.0 ? "塩分を控えめにしてむくみを予防すること" : "高タンパク・食物繊維メニューの継続"
            };

        setWeeklyReviewData(fallbackReview);
        onUpdateBuddySpeech(fallbackReview.weekly_review, fallbackReview.emotion, true);
        setIsAnalyzingWeekly(false);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-3">
          <div className="bg-white w-full max-w-[430px] rounded-t-2xl sm:rounded-2xl shadow-2xl p-4 max-h-[92vh] overflow-y-auto animate-pop space-y-4">
            <div className="flex items-center justify-between border-b pb-2.5">
              <div>
                <span className="text-[11px] text-emerald-600 font-bold">WEEKLY REPORT & BUDDY</span>
                <h3 className="text-base font-extrabold text-gray-800">📈 週間分析レポート＆バディ管理</h3>
              </div>
              <button
                onClick={onClose}
                className="text-gray-400 hover:text-gray-600 p-1 text-xl font-bold"
              >
                ✕
              </button>
            </div>

            <div className="grid grid-cols-3 gap-2 text-center bg-gray-50 p-2.5 rounded-xl border border-gray-200 text-xs">
              <div>
                <div className="text-[10px] text-gray-500">直近7日記録数</div>
                <div className="font-extrabold text-sm text-gray-800">{weeklyStats.recordedDaysCount} / 7日</div>
              </div>
              <div>
                <div className="text-[10px] text-gray-500">平均カロリー</div>
                <div className="font-extrabold text-sm text-emerald-600">{weeklyStats.avgCal} kcal</div>
              </div>
              <div>
                <div className="text-[10px] text-gray-500">目標体重まで</div>
                <div className="font-extrabold text-sm text-indigo-600">
                  あと {Math.max(0, (Number(profile.current_weight) - Number(profile.target_weight))).toFixed(1)} kg
                </div>
              </div>
            </div>

            <div className="bg-white border border-gray-200 rounded-xl p-3">
              <h4 className="text-xs font-bold text-gray-700 mb-2">🕸️ 7日間栄養バランス達成率（レーダー）</h4>
              <div className="h-52 w-full">
                <canvas ref={radarCanvasRef} />
              </div>
            </div>

            <div className="bg-white border border-gray-200 rounded-xl p-3">
              <div className="flex justify-between items-center mb-2">
                <h4 className="text-xs font-bold text-gray-700">⚖️ 体重推移グラフ</h4>
                <span className="text-[10px] text-gray-400">
                  記録件数: {(appData.weight_history || []).length}件
                </span>
              </div>
              <div className="h-48 w-full">
                <canvas ref={lineCanvasRef} />
              </div>
            </div>

            <div className="bg-emerald-50/70 border border-emerald-200 rounded-xl p-3 space-y-2.5">
              <button
                type="button"
                disabled={isAnalyzingWeekly}
                onClick={handleAnalyzeWeekly}
                className="w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow flex items-center justify-center gap-1.5 transition"
              >
                {isAnalyzingWeekly ? (
                  <span>⏳ {currentBuddy.name}が1週間を分析中...</span>
                ) : (
                  <span>📊 1週間の食事をAIバディ({currentBuddy.name})に分析してもらう</span>
                )}
              </button>

              {weeklyReviewData && (
                <div className="bg-white rounded-xl p-3 border border-emerald-200 text-xs space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-emerald-800 flex items-center gap-1">
                      <span>{currentBuddy.emoji}</span>
                      <span>{currentBuddy.name}からの週間総評</span>
                    </span>
                    <button
                      type="button"
                      onClick={() => onUpdateBuddySpeech(weeklyReviewData.weekly_review, weeklyReviewData.emotion, true)}
                      className="text-[11px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md font-bold"
                    >
                      🔈 AI音声で聴く
                    </button>
                  </div>
                  <p className="text-gray-700 leading-relaxed">{weeklyReviewData.weekly_review}</p>
                  <div className="pt-1 border-t border-gray-100 space-y-1 text-[11px]">
                    <div className="text-emerald-700">✅ <strong>Good:</strong> {weeklyReviewData.good_point}</div>
                    <div className="text-amber-700">🎯 <strong>Next:</strong> {weeklyReviewData.improve_point}</div>
                  </div>
                </div>
              )}
            </div>

            <div className="border-t pt-3">
              <h4 className="text-xs font-bold text-gray-700 mb-2">
                🤝 AIコンパニオン交代（個別レベル・固有AIボイス）
              </h4>
              <div className="grid grid-cols-2 gap-2">
                {Object.values(BUDDY_DEFINITIONS).map((b) => {
                  const prog = appData.buddy_progress?.[b.id] || { exp: 0, level: 1 };
                  const expInfo = getExpProgressInfo(prog.exp);
                  const isSelected = profile.selected_buddy === b.id;
                  return (
                    <div
                      key={b.id}
                      onClick={() => onSwitchBuddy(b.id)}
                      className={`p-2.5 rounded-xl border cursor-pointer transition flex flex-col justify-between ${
                        isSelected
                          ? "border-2 bg-emerald-50/50 shadow-xs"
                          : "border-gray-200 bg-white hover:bg-gray-50"
                      }`}
                      style={{ borderColor: isSelected ? b.themeColor : undefined }}
                    >
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-1.5">
                          <span className="text-xl">{b.emoji}</span>
                          <div>
                            <div className="font-bold text-xs text-gray-800 flex items-center gap-1">
                              <span>{b.name}</span>
                              {expInfo.level >= 5 && <span title="マスター称号">👑</span>}
                            </div>
                            <div className="text-[10px] text-gray-500">{b.role}</div>
                          </div>
                        </div>
                        <span
                          className="text-[10px] font-bold text-white px-1.5 py-0.5 rounded"
                          style={{ backgroundColor: b.themeColor }}
                        >
                          Lv.{expInfo.level}
                        </span>
                      </div>
                      <div className="mt-2">
                        <div className="flex justify-between text-[10px] text-gray-500 mb-0.5">
                          <span>EXP: {prog.exp}</span>
                          <span>{isSelected ? "★ 選択中" : "タップで交代"}</span>
                        </div>
                        <div className="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
                          <div
                            className="h-full"
                            style={{ width: `${expInfo.percent}%`, backgroundColor: b.themeColor }}
                          />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 8. メインアプリケーションコンポーネント
    // ==========================================
    const App = () => {
      const todayStr = useMemo(() => getJSTDateString(), []);

      const [appData, setAppData] = useState(() => {
        const defaultBuddyProgress = {
          riko: { exp: 0, level: 1 },
          jinai: { exp: 0, level: 1 },
          allen: { exp: 0, level: 1 },
          sora: { exp: 0, level: 1 },
          shizuka: { exp: 0, level: 1 },
          selena: { exp: 0, level: 1 }
        };

        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              api_key: parsed.api_key || "",
              voice_enabled: parsed.voice_enabled ?? true,
              user_profile: parsed.user_profile || null,
              buddy_progress: { ...defaultBuddyProgress, ...(parsed.buddy_progress || {}) },
              daily_three_meals_bonus_dates: Array.isArray(parsed.daily_three_meals_bonus_dates)
                ? parsed.daily_three_meals_bonus_dates
                : [],
              weight_history: Array.isArray(parsed.weight_history) ? parsed.weight_history : [],
              meal_history: Array.isArray(parsed.meal_history) ? parsed.meal_history : []
            };
          }
        } catch (err) {
          console.error("Failed to load LocalStorage:", err);
        }

        return {
          api_key: "",
          voice_enabled: true,
          user_profile: null,
          buddy_progress: defaultBuddyProgress,
          daily_three_meals_bonus_dates: [],
          weight_history: [],
          meal_history: []
        };
      });

      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [weekOffset, setWeekOffset] = useState(0);
      const [nutritionTab, setNutritionTab] = useState("calories");

      const [buddyEmotion, setBuddyEmotion] = useState("neutral");
      const [buddyDialogue, setBuddyDialogue] = useState("");
      const [isGeneratingSpeech, setIsGeneratingSpeech] = useState(false);
      const [toastNotice, setToastNotice] = useState(null);

      const [isProfileModalOpen, setIsProfileModalOpen] = useState(() => !appData.user_profile);
      const [mealModalConfig, setMealModalConfig] = useState({ isOpen: false, mealType: "lunch", mode: "manual" });
      const [isWeeklyModalOpen, setIsWeeklyModalOpen] = useState(false);
      const [isAnalyzingDaily, setIsAnalyzingDaily] = useState(false);

      const [weightInput, setWeightInput] = useState("");

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        } catch (err) {
          console.error("Failed to save LocalStorage:", err);
        }
      }, [appData]);

      const showToast = (msg) => {
        setToastNotice(msg);
        setTimeout(() => {
          setToastNotice((prev) => (prev === msg ? null : prev));
        }, 3800);
      };

      const currentBuddyId = appData.user_profile?.selected_buddy || "riko";
      const currentBuddy = BUDDY_DEFINITIONS[currentBuddyId] || BUDDY_DEFINITIONS.riko;
      const currentBuddyExp = appData.buddy_progress?.[currentBuddyId]?.exp || 0;
      const currentExpInfo = getExpProgressInfo(currentBuddyExp);

      useEffect(() => {
        const dayRecord = (appData.weight_history || []).find((w) => w.date === selectedDate);
        if (dayRecord) {
          setWeightInput(String(dayRecord.weight));
        } else if (appData.user_profile?.current_weight) {
          setWeightInput(String(appData.user_profile.current_weight));
        }
      }, [selectedDate, appData.weight_history, appData.user_profile?.current_weight]);

      const initCheckDoneRef = useRef(false);
      useEffect(() => {
        if (!appData.user_profile || initCheckDoneRef.current) return;
        initCheckDoneRef.current = true;

        const profile = appData.user_profile;
        const buddy = BUDDY_DEFINITIONS[profile.selected_buddy] || BUDDY_DEFINITIONS.riko;
        const yesterdayStr = addDays(todayStr, -1);
        const yesterdayMeals = (appData.meal_history || []).filter((m) => m.date === yesterdayStr);
        const hasPastActivity =
          (appData.meal_history || []).length > 0 ||
          (appData.weight_history || []).length > 0 ||
          (profile.last_login_date && profile.last_login_date < todayStr);

        let updatedData = { ...appData };
        let bonusAwarded = false;

        if (profile.last_login_date && profile.last_login_date !== todayStr) {
          if (yesterdayMeals.length > 0) {
            const yCal = yesterdayMeals.reduce((sum, m) => sum + (Number(m.calories) || 0), 0);
            if (yCal >= profile.bmr && yCal <= profile.target_calories) {
              const prevExp = updatedData.buddy_progress[buddy.id]?.exp || 0;
              const newExp = prevExp + 30;
              updatedData.buddy_progress = {
                ...updatedData.buddy_progress,
                [buddy.id]: { exp: newExp, level: calculateLevelFromExp(newExp) }
              };
              bonusAwarded = true;
            }
          }
          updatedData.user_profile = {
            ...updatedData.user_profile,
            last_login_date: todayStr
          };
          setAppData(updatedData);
        }

        if (hasPastActivity && yesterdayMeals.length === 0) {
          const scoldList = buddy.scoldQuotes || [];
          const scoldText =
            scoldList[Math.floor(Math.random() * scoldList.length)] ||
            "昨日の食事記録が抜けていますよ！今日はしっかり記録してくださいね！";
          setBuddyEmotion("angry");
          setBuddyDialogue(scoldText);
          setTimeout(() => {
            speakBuddyDialogue(scoldText, buddy.id, appData.voice_enabled, appData.api_key, setIsGeneratingSpeech);
          }, 300);
        } else if (bonusAwarded) {
          const msg = `昨日の摂取カロリーが目標範囲内だったので、達成ボーナス +30 EXP を獲得しました！${buddy.quotes[currentExpInfo.level]?.[0] || ""}`;
          setBuddyEmotion("smile");
          setBuddyDialogue(msg);
          showToast("🎉 前日目標カロリー達成ボーナス +30 EXP！");
          setTimeout(() => {
            speakBuddyDialogue(msg, buddy.id, appData.voice_enabled, appData.api_key, setIsGeneratingSpeech);
          }, 300);
        } else {
          const lvQuotes = buddy.quotes[currentExpInfo.level] || buddy.quotes[1];
          const initQuote = lvQuotes[Math.floor(Math.random() * lvQuotes.length)];
          setBuddyEmotion("neutral");
          setBuddyDialogue(initQuote);
        }
      }, [appData.user_profile]);

      const updateBuddySpeech = (text, emotion = "neutral", shouldSpeak = true) => {
        setBuddyEmotion(emotion);
        setBuddyDialogue(text);
        if (shouldSpeak) {
          speakBuddyDialogue(text, currentBuddy.id, appData.voice_enabled, appData.api_key, setIsGeneratingSpeech);
        }
      };

      const handleTapBuddyAvatar = () => {
        unlockSpeechSynthesis();
        const lv = currentExpInfo.level;
        const pool = [];
        for (let i = 1; i <= lv; i++) {
          if (currentBuddy.quotes[i]) {
            pool.push(...currentBuddy.quotes[i]);
          }
        }
        const chosen = pool[Math.floor(Math.random() * pool.length)] || currentBuddy.quotes[1][0];
        const emotionsByLv = lv >= 3 ? ["smile", "shy", "neutral"] : ["neutral", "smile"];
        const pickedEmotion = emotionsByLv[Math.floor(Math.random() * emotionsByLv.length)];
        updateBuddySpeech(chosen, pickedEmotion, true);
      };

      const toggleVoiceEnabled = () => {
        setAppData((prev) => {
          const nextVal = !prev.voice_enabled;
          if (!nextVal) {
            stopAllActiveAudio();
            setIsGeneratingSpeech(false);
          }
